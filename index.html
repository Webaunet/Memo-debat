/* ===== Connexion et synchro (Supabase, API REST) ===== */
let auth=null;try{auth=JSON.parse(lsGet("memoAuth")||"null")}catch(e){}
let meta={synced:false,last:""};try{meta=JSON.parse(lsGet("memoSync")||"")||meta}catch(e){}
let syncState=auth?"ok":"off",syncMsg="",syncBusy=false,syncAgain=false,pushT=0;
async function sb(path,{method="GET",body,token,prefer}={}){
  const h={apikey:SB_KEY,"Content-Type":"application/json"};
  if(token)h.Authorization="Bearer "+token;
  if(prefer)h.Prefer=prefer;
  const r=await fetch(SB_URL+path,{method,headers:h,body:body?JSON.stringify(body):undefined});
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok){const e=new Error((j&&(j.msg||j.error_description||j.message||j.error))||("HTTP "+r.status));e.status=r.status;throw e}
  return j;
}
function setAuth(s){
  auth=s&&s.access_token?{access_token:s.access_token,refresh_token:s.refresh_token,expires_at:s.expires_at||Math.floor(Date.now()/1000)+(s.expires_in||3600),user:{id:s.user.id,email:s.user.email}}:null;
  if(auth)lsSet("memoAuth",JSON.stringify(auth));else try{localStorage.removeItem("memoAuth")}catch(e){}
}
async function token(){
  if(!auth)throw new Error("non connecté");
  if(auth.expires_at-60<Date.now()/1000){
    try{const s=await sb("/auth/v1/token?grant_type=refresh_token",{method:"POST",body:{refresh_token:auth.refresh_token}});setAuth({...s,user:s.user||auth.user})}
    catch(e){if(e.status>=400&&e.status<500){setAuth(null);syncState="off";throw new Error("session expirée, reconnecte-toi")}throw e}
  }
  return auth.access_token;
}
async function login(email,pw,create){
  if(create){const r=await sb("/auth/v1/signup",{method:"POST",body:{email,password:pw}});if(!r||!r.access_token)return"confirm";setAuth(r)}
  else setAuth(await sb("/auth/v1/token?grant_type=password",{method:"POST",body:{email,password:pw}}));
  meta={synced:false,last:""};lsSet("memoSync",JSON.stringify(meta));
  return"ok";
}
function logout(){setAuth(null);syncState="off";meta={synced:false,last:""};lsSet("memoSync",JSON.stringify(meta))}
function hasData(d){return!!d&&Array.isArray(d.themes)&&(d.themes.some(t=>t.subs&&t.subs.length)||(d.sources||[]).length>0)}
function mergeDb(a,b){
  const o={v:2,updated:now(),themes:[],sources:[]},pick=(x,y)=>!x?y:!y?x:((y.u||"")>(x.u||"")?y:x),srcs=new Map();
  [...(a.sources||[]),...(b.sources||[])].forEach(s=>srcs.set(s.id,pick(srcs.get(s.id),s)));o.sources=[...srcs.values()];
  const th=new Map();
  for(const t of[...a.themes,...b.themes]){
    let T=th.get(t.id);if(!T){T={id:t.id,name:t.name,u:t.u,subs:[]};th.set(t.id,T)}else if((t.u||"")>(T.u||"")){T.name=t.name;T.u=t.u}
    for(const s of t.subs){
      let S=T.subs.find(x=>x.id===s.id);if(!S){S={id:s.id,name:s.name,u:s.u,items:[]};T.subs.push(S)}else if((s.u||"")>(S.u||"")){S.name=s.name;S.u=s.u}
      for(const it of s.items){const i=S.items.findIndex(x=>x.id===it.id);if(i<0)S.items.push(it);else S.items[i]=pick(S.items[i],it)}
    }
  }
  th.forEach(T=>T.subs.forEach(S=>S.items.sort((x,y)=>(y.t||"")<(x.t||"")?-1:1)));
  o.themes=[...th.values()];return o;
}
function queuePush(){if(!auth)return;syncState="dirty";updSync();clearTimeout(pushT);pushT=setTimeout(()=>syncNow(),1500)}
async function syncNow(manual){
  if(!auth)return;
  if(syncBusy){syncAgain=true;return}
  syncBusy=true;syncState="busy";updSync();
  try{
    const tk=await token();
    const rows=await sb("/rest/v1/memo?select=data,updated_at",{token:tk});
    const remote=rows&&rows[0];
    const push=async()=>{await sb("/rest/v1/memo?on_conflict=user_id",{method:"POST",token:tk,prefer:"resolution=merge-duplicates,return=minimal",body:{user_id:auth.user.id,data:db,updated_at:db.updated}})};
    if(!remote)await push();
    else{
      const rd=migrate(remote.data),rt=Date.parse(remote.updated_at)||0,lt=Date.parse(db.updated)||0;
      if(!meta.synced&&!hasData(db)&&hasData(rd)){db=rd;db.updated=remote.updated_at;lsSet("memo",JSON.stringify(db));rerender()}
      else if(!meta.synced&&hasData(db)&&hasData(rd)){db=mergeDb(db,rd);lsSet("memo",JSON.stringify(db));await push();syncMsg="Données des deux appareils fusionnées.";rerender()}
      else if(rt>lt){db=rd;db.updated=remote.updated_at;lsSet("memo",JSON.stringify(db));rerender()}
      else if(lt>rt)await push();
    }
    meta={synced:true,last:now()};lsSet("memoSync",JSON.stringify(meta));syncState="ok";flushImages();
  }catch(e){syncState=(!navigator.onLine||e instanceof TypeError)?"offline":"err";syncMsg=e.message;if(!auth)syncState="off"}
  finally{syncBusy=false;updSync();if(syncAgain){syncAgain=false;queuePush()}}
}

let rec=null;
function dictate(cb,btn,cont){
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!R){toast("Dictée indisponible sur ce navigateur (essaie Chrome).");return}
  if(rec){rec.stop();return}
  rec=new R();rec.lang="fr-FR";rec.interimResults=false;rec.continuous=!!cont;
  rec.onresult=e=>cb([...e.results].slice(e.resultIndex).map(r=>r[0].transcript).join(" ").trim());
  rec.onerror=e=>toast("Micro : "+(e.error==="not-allowed"?"accès refusé":e.error));
  rec.onend=()=>{rec=null;btn&&btn.classList.remove("rec")};
  btn&&btn.classList.add("rec");rec.start();
}

function route(){
  const p=location.hash.replace(/^#\/?/,"").split("/"),k=p[0]||"";
  document.body.classList.toggle("dkbody",k==="a"&&!!p[1]);
  window.scrollTo(0,0);
  if(k==="h"&&p[1])themePage(p[1]);
  else if(k==="t"&&p[1])subPage(p[1]);
  else if(k==="f"&&p[2])fiche(p[1],p[2]);
  else if(k==="e"&&p[2])editPage(p[1],p[2]);
  else if(k==="s")sourcesPage();
  else if(k==="r"&&p[1])sourcePage(p[1]);
  else if(k==="a")p[1]?cheat(p[1]):debatePicker();
  else if(k==="c")accountPage();
  else home();
}
